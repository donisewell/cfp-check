<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Option 5: Bold PL lettermark with lens accent — clean and modern -->
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#1a1a2e"/>
  
  <!-- "P" letter -->
  <path d="M28 98 L28 30 L56 30 C72 30 80 40 80 50 C80 60 72 70 56 70 L28 70" 
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- "L" letter -->
  <path d="M88 30 L88 98 L112 98" 
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Lens dot accent on the P -->
  <circle cx="56" cy="50" r="6" fill="#00B5EA"/>
  
  <!-- Subtle underline accent -->
  <line x1="28" y1="108" x2="112" y2="108" stroke="#FFCC33" stroke-width="3" stroke-linecap="round"/>
</svg>
