<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Option 1: Magnifying glass over a document — "investigation/transparency" -->
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#333333"/>
  
  <!-- Document -->
  <rect x="30" y="24" width="48" height="62" rx="4" fill="#ffffff" opacity="0.9"/>
  <line x1="38" y1="38" x2="70" y2="38" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="48" x2="70" y2="48" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="58" x2="58" y2="58" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="68" x2="65" y2="68" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Magnifying glass -->
  <circle cx="78" cy="78" r="22" fill="none" stroke="#00B5EA" stroke-width="5"/>
  <line x1="94" y1="94" x2="108" y2="108" stroke="#00B5EA" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Exclamation mark in lens -->
  <line x1="78" y1="68" x2="78" y2="82" stroke="#FFCC33" stroke-width="4" stroke-linecap="round"/>
  <circle cx="78" cy="88" r="2.5" fill="#FFCC33"/>
</svg>
