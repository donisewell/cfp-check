  <rect width="128" height="128" rx="24" fill="#1a5632"/>
  
  <!-- Shield shape -->
  <path d="M64 18 L100 34 L100 62 C100 86 82 102 64 110 C46 102 28 86 28 62 L28 34 Z" 
        fill="none" stroke="#8FFFB0" stroke-width="4"/>
  
  <!-- Eye inside shield -->
  <ellipse cx="64" cy="60" rx="22" ry="14" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="64" cy="60" r="8" fill="#ffffff"/>
  <circle cx="64" cy="60" r="4" fill="#1a5632"/>
  
  <!-- Lens flare / shine -->
  <circle cx="61" cy="57" r="2" fill="#ffffff" opacity="0.8"/>
</svg>
