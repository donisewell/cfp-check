<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Option 4: Geometric lens/prism — "seeing the full spectrum" -->
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#333333"/>
  
  <!-- Prism/lens shape -->
  <polygon points="64,22 106,90 22,90" fill="none" stroke="#00B5EA" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Light beam going in -->
  <line x1="10" y1="56" x2="52" y2="56" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Spectrum coming out (disclosure categories) -->
  <line x1="80" y1="70" x2="118" y2="60" stroke="#8FFFB0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="76" x2="118" y2="76" stroke="#FFCC33" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="82" x2="118" y2="92" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- "PL" text subtle -->
  <text x="54" y="72" font-family="Arial" font-weight="bold" font-size="20" fill="#ffffff" opacity="0.9">PL</text>
</svg>
